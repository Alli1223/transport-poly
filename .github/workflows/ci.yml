name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake --preset windows-msvc
      - name: Build
        run: cmake --build --preset windows-msvc-release
      - name: Test
        run: ctest --preset windows-msvc-release
      - name: Package
        run: cpack --preset windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: transport-poly-windows
          path: build/windows-msvc/packages/*.zip

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build libgl1-mesa-dev xorg-dev
      - name: Configure
        run: cmake --preset linux-gcc -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
      - name: Build
        run: cmake --build --preset linux-gcc-release
      - name: Test
        run: ctest --preset linux-gcc-release
      - name: Package
        run: cpack --preset linux-gcc
      - uses: actions/upload-artifact@v4
        with:
          name: transport-poly-linux
          path: build/linux-gcc/packages/*.tar.gz

  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y g++-14 ninja-build
      - name: Configure without graphics or audio dependencies
        run: cmake --preset linux-headless -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 -DTP_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset linux-headless-release
      - name: Test
        run: ctest --preset linux-headless-release
